<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-4">
  <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 460px;">

    <!-- Header -->
    <div class="text-center mb-4">
      <div class="mb-3">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="16" width="40" height="28" rx="4" fill="#0d6efd" opacity="0.15"/>
          <rect x="4" y="16" width="40" height="28" rx="4" stroke="#0d6efd" stroke-width="2.5"/>
          <path d="M4 24h40" stroke="#0d6efd" stroke-width="2.5"/>
          <rect x="8" y="28" width="8" height="4" rx="1" fill="#0d6efd"/>
          <path d="M14 10L24 4l10 6" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h4 class="fw-bold mb-1">Create account</h4>
      <p class="text-muted small">Fill in your details to get started</p>
    </div>

    <!-- Success Banner -->
    <div class="alert alert-success py-2 small d-flex align-items-center gap-2" *ngIf="successMessage">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      {{ successMessage }}
    </div>

    <!-- Error Banner -->
    <div class="alert alert-danger py-2 small d-flex align-items-center gap-2" *ngIf="errorMessage">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ errorMessage }}
    </div>

    <!-- Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate *ngIf="!successMessage">

      <!-- First & Middle Name -->
      <div class="row g-3 mb-3">
        <div class="col-7">
          <label for="firstName" class="form-label fw-semibold small">First Name <span class="text-danger">*</span></label>
          <input
            id="firstName"
            type="text"
            class="form-control"
            [class.is-invalid]="firstName.invalid && firstName.touched"
            formControlName="firstName"
            placeholder="Juan"
          />
          <div class="invalid-feedback">
            <span *ngIf="firstName.errors?.['required']">Required.</span>
            <span *ngIf="firstName.errors?.['maxlength']">Max 50 characters.</span>
          </div>
        </div>
        <div class="col-5">
          <label for="middleName" class="form-label fw-semibold small">Middle Name</label>
          <input
            id="middleName"
            type="text"
            class="form-control"
            formControlName="middleName"
            placeholder="Optional"
          />
        </div>
      </div>

      <!-- Last Name -->
      <div class="mb-3">
        <label for="lastName" class="form-label fw-semibold small">Last Name <span class="text-danger">*</span></label>
        <input
          id="lastName"
          type="text"
          class="form-control"
          [class.is-invalid]="lastName.invalid && lastName.touched"
          formControlName="lastName"
          placeholder="Dela Cruz"
        />
        <div class="invalid-feedback">
          <span *ngIf="lastName.errors?.['required']">Required.</span>
          <span *ngIf="lastName.errors?.['maxlength']">Max 50 characters.</span>
        </div>
      </div>

      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold small">Username <span class="text-danger">*</span></label>
        <input
          id="username"
          type="text"
          class="form-control"
          [class.is-invalid]="username.invalid && username.touched"
          formControlName="username"
          placeholder="juandc123"
          autocomplete="username"
        />
        <div class="invalid-feedback">
          <span *ngIf="username.errors?.['required']">Username is required.</span>
          <span *ngIf="username.errors?.['minlength']">Minimum 4 characters.</span>
          <span *ngIf="username.errors?.['maxlength']">Maximum 30 characters.</span>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-control border-end-0"
            [class.is-invalid]="password.invalid && password.touched"
            formControlName="password"
            placeholder="Min. 6 characters"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="btn btn-outline-secondary border-start-0"
            (click)="showPassword = !showPassword"
            tabindex="-1"
          >
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
          <div class="invalid-feedback">
            <span *ngIf="password.errors?.['required']">Password is required.</span>
            <span *ngIf="password.errors?.['minlength']">Minimum 6 characters.</span>
          </div>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary w-100 fw-semibold" [disabled]="loading">
        <span *ngIf="!loading">Create Account</span>
        <span *ngIf="loading">
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          Creating...
        </span>
      </button>

    </form>

    <!-- Footer -->
    <p class="text-center text-muted small mt-4 mb-0">
      Already have an account?
      <a routerLink="/login" class="text-primary fw-semibold text-decoration-none">Sign in</a>
    </p>

  </div>
</div>
