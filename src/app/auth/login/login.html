<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 420px;">

    <!-- Header -->
    <div class="text-center mb-4">
      <div class="mb-3">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
          <rect x="4" y="16" width="40" height="28" rx="4" fill="#0d6efd" opacity="0.15"/>
          <rect x="4" y="16" width="40" height="28" rx="4" stroke="#0d6efd" stroke-width="2.5"/>
          <path d="M4 24h40" stroke="#0d6efd" stroke-width="2.5"/>
          <rect x="8" y="28" width="8" height="4" rx="1" fill="#0d6efd"/>
          <path d="M14 10L24 4l10 6" stroke="#0d6efd" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h4 class="fw-bold mb-1">Welcome back</h4>
      <p class="text-muted small">Sign in to your account</p>
    </div>

    <!-- Error Banner -->
    @if (errorMessage()) {
      <div class="alert alert-danger py-2 small d-flex align-items-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMessage() }}
      </div>
    }

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold small">Username</label>
        <input
          id="username"
          type="text"
          class="form-control"
          [class.is-invalid]="username.invalid && username.touched"
          formControlName="username"
          placeholder="Enter your username"
          autocomplete="username"
        />
        <div class="invalid-feedback">
          @if (username.errors?.['required']) { Username is required. }
          @if (username.errors?.['minlength']) { At least 4 characters. }
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold small">Password</label>
        <div class="input-group">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control border-end-0"
            [class.is-invalid]="password.invalid && password.touched"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="btn btn-outline-secondary border-start-0"
            (click)="showPassword.set(!showPassword())"
            tabindex="-1">
            @if (!showPassword()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45
                  18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11
                  8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            }
          </button>
          <div class="invalid-feedback">Password is required.</div>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary w-100 fw-semibold"
        [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          Signing in...
        } @else {
          Sign In
        }
      </button>

    </form>

    <!-- Footer -->
    <p class="text-center text-muted small mt-4 mb-0">
      Don't have an account?
      <a routerLink="/register" class="text-primary fw-semibold text-decoration-none">
        Create one
      </a>
    </p>

  </div>
</div>
